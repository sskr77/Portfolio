<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Rayen / SKR7</title>
  <meta name="description" content="Rayen Ghribi — selected video editing work." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    .category-page{max-width:var(--max);margin:auto;padding:45px 28px 120px}
    .back-link{display:inline-flex;align-items:center;gap:12px;font:11px "DM Mono",monospace;color:#999;border-bottom:1px solid #333;padding-bottom:9px;transition:.25s}
    .back-link:hover{color:var(--accent);border-color:var(--accent);gap:18px}
    .category-hero{padding:105px 0 75px;border-bottom:1px solid var(--line)}
    .category-hero h1{font-size:clamp(65px,10vw,145px);line-height:.83;letter-spacing:-.075em;margin-top:22px}
    .category-description{max-width:550px;color:#888;line-height:1.6;margin-top:30px;font-size:15px}
    .video-list{padding-top:55px;display:grid;grid-template-columns:1fr 1fr;gap:55px 22px}
    .video-item{min-width:0}
    .video-item iframe{width:100%;aspect-ratio:16/9;border:0;background:#111;display:block}
    .video-item .local-video{width:100%;aspect-ratio:16/9;display:block;background:#111}
    .video-item h2{font-size:21px;margin-top:17px;letter-spacing:-.03em;font-weight:500}
    .video-meta{font:10px "DM Mono",monospace;color:#666;margin-top:7px}
    .empty-state{border:1px dashed #333;padding:75px 30px;text-align:center;color:#777;grid-column:1/-1}
    .empty-state strong{display:block;color:#aaa;font-size:20px;margin-bottom:12px}
    .reels-grid{padding-top:55px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
    .reel-item video,.reel-item iframe{width:100%;aspect-ratio:9/16;display:block;background:#111;border:0}
    .reel-item h2{font-size:16px;margin-top:13px;font-weight:500}
    .reel-item .video-meta{margin-top:5px}
    .category-footer{border-top:1px solid var(--line);margin-top:100px;padding-top:25px;display:flex;justify-content:space-between}
    @media(max-width:800px){
      .category-page{padding:30px 18px 80px}
      .category-hero{padding:80px 0 55px}
      .video-list{grid-template-columns:1fr;gap:45px}
      .reels-grid{grid-template-columns:1fr 1fr;gap:12px}
      .category-footer{margin-top:70px}
    }
    @media(max-width:500px){.reels-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="noise"></div>

  <header class="nav">
    <a class="logo" href="index.html">SKR7<span>®</span></a>
    <nav>
      <a href="index.html#work">WORK</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#contact">CONTACT</a>
    </nav>
    <a class="nav-cta" href="index.html#contact">LET'S TALK <span>↗</span></a>
  </header>

  <main class="category-page">
    <a class="back-link" href="index.html#work">← BACK TO PORTFOLIO</a>

    <section class="category-hero">
      <p class="eyebrow" id="category-number">02 — CATEGORY</p>
      <h1 id="category-title">WORK.</h1>
      <p class="category-description" id="category-description"></p>
    </section>

    <section id="content"></section>

    <div class="category-footer">
      <a class="back-link" href="index.html#work">← MAIN PAGE</a>
      <a class="back-link" href="index.html#contact">CONTACT ↗</a>
    </div>
  </main>

  <script src="category.js"></script>
</body>
</html>
